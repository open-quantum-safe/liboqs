# @summary    A map from family key to algorithm family metadata. Family key
#             must follow snake casing because it serves as default dir
algfamilies:

  demo_kem:
    displayname: Required
    algtype: kem, sig, or stfl_sig
    principal-submitters:
      - Non-empty List
    auxiliary-submitters:
      - Optional, defaults to empty list
    crypto-assumption: >-
      A single line summarizing the core hard problem
    website: >-
      Required
    # TODO: what are the possible values
    nist-round: Required
    spec-version: Required
    standardization-status: Required
    upstream-maintenance: Required
    upstream-statement-url: null
    primary-upstream: upstream_key
    # TODO: What does default-upstream-id do?
    # default-upstream-id: clean
    oqs-support-tier: 1, 2, or 3
    # TODO: What does upstream-ancestors do?
    upstream-ancestors: null
    advisories: null
    parameters:
      param1: # for kem
        nist_level: 1, 2, 3, 4, or 5
        security: IND-CCA2
        length-public-key: 261120
        length-ciphertext: 96
        length-secret-key: 6492
        length-shared-secret: 32
        length-keypair-seed: null
        length-encaps-seed: null
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        enable-by: C/CMake macro
        default-implementation: impl_key, must be portable
        memopt-implementation: null
      param2: # for sig
        claimed-nist-level: 1
        claimed-security: EUF-CMA
        length-public-key: 60
        length-secret-key: 88
        length-signature: 3280
        length-mu: 64
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        enable-by: OQS_ENABLE_SIG_mqom_mqom2_cat1_gf16_fast_r5
        default-implementation: mqom2_cat1_gf16_fast_r5_default
        memopt-implementation: mqom2_cat1_gf16_fast_r5_memopt
    common_src:
      common_key:
        upstream: upstream_key
        destdir: defaults to common_key
        upstream_base_dir: null
        files: [
          "*.c",         # can match wildcard
          "some/dir",    # copy the entire directory
          "other/dir/",  # copy the content
        ]
    implementations-switch-on-runtime-cpu-features: true
    implementations:
      impl1:  # local, kem
        version: Some string
        enable-by: C/CMake macro
        subdirname: defaults to impl_key
        parameter: param_key
        uarch: portable, x86_64, arm_8
        os: Defaults to []
        cpufeatures: Defaults to []
        sources:
          - upstream: upstream_key
            base_dir: null
            preserve_subdirs: false
            files: [
              "*.c",         # can match wildcard
              "some/dir",    # copy the entire directory
              "other/dir/",  # copy the content
            ]
          - family_common: family_common_key
        includes:
          - scope: private, public, or interface
            dir: "literal string, directly copied into target_include_directories "
        old_gas_syntax_if_darwin: false
        compile_opts:
          - scope: private, public, or interface
            opts: "literal string directly copied into target_compile_options"
        # kem API
        signature_keypair: null
        signature_enc: null
        signature_dec: null
        signature_keypair_derand: null
        signature_enc_derand: null
        # sig API
        signature_keypair: null
        signature_signature: null
        signature_verify: null
        signature_signature_extmu: null
        signature_verify_extmu: null
      impl_remote:  # remote, could be kem or sig
        upstream: upstream_key
        remote_meta_path: must be explicit, no templating
        remote_impl_key: the impl_key under remote meta's implementations


  classic_mceliece:
    display_name: Classic McEliece
    algtype: kem
    principal-submitters:
      - Daniel J. Bernstein
      - Tung Chou
      - Tanja Lange
      - Ingo von Maurich
      - Rafael Misoczki
      - Ruben Niederhagen
      - Edoardo Persichetti
      - Christiane Peters
      - Peter Schwabe
      - Nicolas Sendrier
      - Jakub Szefer
      - Wen Wang
    # @summary    A list of auxiliary submitters. Defaults to empty list.
    auxiliary-submitters: null
    crypto-assumption: >-
      Niederreiter's dual version of McEliece's public key encryption using
      binary Goppa codes
    website: https://classic.mceliece.org
    nist-round: 3
    spec-version: SUPERCOP-20221025
    standardization-status:
      Under [ISO](https://classic.mceliece.org/iso.html) consideration
    upstream-maintenance: No active maintenance
    upstream-statement-url:
      https://github.com/PQClean/PQClean/blob/dca1ee2/README.md
    primary-upstream: pqclean
    oqs-support-tier: 3
    upstream-ancestors:
      - SUPERCOP-20221025 "clean" and "avx2" implementations
    advisories:
      - >
        Classic-McEliece-460896, Classic-McEliece-460896f,
        Classic-McEliece-6960119, and Classic-McEliece-6960119f parameter sets
        fail memory leak testing on x86-64 when building with ``clang`` using
        optimization level ``-O2`` and ``-O3``. Care is advised when using the
        algorithm at higher optimization levels, and any other compiler and
        architecture.
      - >
        Current implementation of the algorithm may not be constant-time.
        Additionally, environment specific constant-time leaks may not be
        documented; please report potential constant-time leaks when found.
    parameter-sets:
      mceliece348864:
        claimed-nist-level: 1
        claimed-security: IND-CCA2
        length-public-key: 261120
        length-ciphertext: 96
        length-secret-key: 6492
        length-shared-secret: 32
        length-keypair-seed: null
        length-encaps-seed: null
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        # TODO: This field is only false for CROSS, MQOM, and NTRUPrime
        implementations-switch-on-runtime-cpu-features: true
        # @summary  The C pre-processing macro and CMake flag that controls
        #           whether this parameter set is compiled into liboqs. The
        #           parameter-set macro will overwrite the implementation-level
        #           "enable_by" for the default impl of this parameter set.
        enable_by: OQS_ENABLE_KEM_classic_mceliece_348864
        # @summary  The key of the default implementation. Default
        #           implementation is always enabled and compiled into the
        #           library if the parameter set is enabled.
        default-implementation: pqclean_mceliece348864_clean
      # mceliece348864f: null
      # mceliece460896: null
      # mceliece460896f: null
      # mceliece6688128: null
      # mceliece6688128f: null
      # mceliece6960119: null
      # mceliece6960119f: null
      # mceliece8192128: null
      # mceliece8192128f: null
    implementations:  # classic_mceliece
      pqclean_mceliece348864_avx2:
        version: SUPERCOP-20221025
        # @summary  The C pre-processing macro and CMake flag that controls
        #           whether this implementation is compiled into liboqs. If this
        #           impl is the default imple of some parameter set, than the
        #           parameter-level `enable_by` will overwrite this `enable_by`.
        #           Because of the overwrite, `enable_by` is optional if
        #           this implementation is some parameter's default impl.
        #           Missing `enable_by` in non-default impl is invalid.
        enable_by: OQS_ENABLE_KEM_classic_mceliece_348864_avx2
        # @summary  The subdirectory into which source files are copied.
        #           Defaults to {{ impl_key }}
        dirname: null
        # @summary  The parameter set this implementation implements. It must be
        #           a valid parameter key under the same family.
        parameter-set: mceliece348864
        # @summary  The microarchitecture of the implementation. Must be one of
        #           "x86_64", "aarch64", or "portable". Defaults to "portable".
        uarch: x86_64
        # TODO: What does operating_systems do?
        operating_systems: ["Linux", "Darwin"]
        # @summary  A list of CPU features required by this implementation.
        required_flags: [avx2, popcnt]
        # @summary  An upstream key matching the upstream repository from which
        #           source files are copied.
        upstream: pqclean
        sources:
          from_upstream:
            # @summary  The base directory onto which file paths are appended.
            #           Defaults to root directory of the upstream.
            base_dir: null
            # @summary  list files to be copied from upstream repository to
            #           src/{{ algtype }}/{{ family_key}}/{{ impl_key }} subdir.
            #           End an entry with a slash to indicate copying content 
            #           rather than the directory itself. Wildcard matching
            #           is also supported
            files: ["crypto_kem/mceliece348864/avx2/"]
          # @summary  Specify the source files of this implementation that are
          #           shared across many implementations within the same family.
          #           For now we don't have source files shared across many
          #           families. Instead, common dependencies like symmetric
          #           primitives are compiled into a separate object to be
          #           linked against in src/CMakeLists.txt:91. See `mqom` for
          #           a non-empty example.
          from_family_common: null
        # @summary each item corresponds to one call to target_include_directories
        #          scope must be one of private, public, or interface. dir will be
        #          treated as literal and copied directly
        includes:
          - scope: private
            dir: "${CMAKE_CURRENT_LIST_DIR}/pqclean_mceliece348864_clean"
          - scope: private
            dir: "${PROJECT_SOURCE_DIR}/src/common/pqclean_shims"
        # @summary  If true, add target_compile_definitions(old_gas_syntax) if
        #           CMAKE_SYSTEM_NAME is Darwin. Defaults to false.
        old_gas_syntax_if_darwin: true
        # @summary  Each item corresponds to one target_compile_options call
        # @type     list of (scope, opts) pair. The `opts` field is treated as
        #           a string literal and can contain multiple flags
        compile_opts:
          - scope: private
            # TODO: Not always in sync with `required_flags`
            opts: "-mavx2 -mpopcnt"
          - scope: private
            opts: "-Wno-language-extension-token -O1"
        signature_keypair: PQCLEAN_MCELIECE348864_AVX2_crypto_kem_keypair
        signature_enc: PQCLEAN_MCELIECE348864_AVX2_crypto_kem_enc
        signature_dec: PQCLEAN_MCELIECE348864_AVX2_crypto_kem_dec
        signature_keypair_derand: null
        signature_enc_derand: null
      # pqclean_mceliece348864_clean: null
      # pqclean_mceliece348864f_avx2: null
      # pqclean_mceliece348864f_clean: null
      # pqclean_mceliece460896_avx2: null
      # pqclean_mceliece460896_clean: null
      # pqclean_mceliece460896f_avx2: null
      # pqclean_mceliece460896f_clean: null
      # pqclean_mceliece6688128_avx2: null
      # pqclean_mceliece6688128_clean: null
      # pqclean_mceliece6688128f_avx2: null
      # pqclean_mceliece6688128f_clean: null
      # pqclean_mceliece6960119_avx2: null
      # pqclean_mceliece6960119_clean: null
      # pqclean_mceliece6960119f_avx2: null
      # pqclean_mceliece6960119f_clean: null
      # pqclean_mceliece8192128_avx2: null
      # pqclean_mceliece8192128_clean: null
      # pqclean_mceliece8192128f_avx2: null
      # pqclean_mceliece8192128f_clean: null


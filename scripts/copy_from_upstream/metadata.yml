# v2 of copy_from_upstream.yml
# NOTE: v2 schema aims to encapsulate both copy_from_upstream.yml and
#       docs/algorithms/{{ kem|sig|sig_stfl }}/{{ family }}.yml
#
# TODO: Excessive indenting in YAML. Indent by 2 spaces instead of 4. Use more
#       graphically-oriented IDE's like VSCode.
#
# TODO: include license information here?
#
# NOTE: use | (preserve new line) or > (fold into space) for bulk text
#       |+ and >+ will preserve all trailing new lines
#       |- and >- will trim all trailing new lines
version: 2

upstreams:
  pqc-hqc:
    # NOTE: sources type: files
    git_url: https://gitlab.com/pqc-hqc/hqc.git
    # TODO: some git server might prohibit checking out arbitrary commit. In
    #       these cases we might still need to checkout by branch.
    git_commit: 161cd4fdf6b4a5198cf40b3a1243f9f27f13e03d
    # NOTE:
    # - use square brackets iff it can fit in one line
    # - patch paths are relative to some PATCH_DIR
    # - `patches` is optional
    patches: [pqchqc-liboqs-integration.patch]

  oldpqclean:
    # NOTE: sources type: directory
    git_url: https://github.com/PQClean/PQClean.git
    git_commit: 8e220a87308154d48fdfac40abbb191ac7fce06a
    patches:
      - pqclean-kyber-armneon-shake-fixes.patch
      - pqclean-kyber-armneon-768-1024-fixes.patch
      - pqclean-kyber-armneon-variable-timing-fix.patch
      - pqclean-kyber-armneon-asan.patch

  pqclean:
    # NOTE: sources type: directory
    git_url: https://github.com/PQClean/PQClean.git
    git_commit: 1eacfdafc15ddc5d5759d0b85b4cef26627df181
    patches: [classic-mceliece_memset.patch]

  pqcrystals-kyber:
    # NOTE: sources type: files
    git_url: https://github.com/pq-crystals/kyber.git
    git_commit: 441c0519a07e8b86c8d079954a6b10bd31d29efc
    patches: 
      - pqcrystals-kyber-yml.patch
      - pqcrystals-kyber-ref-shake-aes.patch
      - pqcrystals-kyber-avx2-shake-aes.patch

  mlkem-native:
    # NOTE: sources type: recursive
    git_url: https://github.com/pq-code-package/mlkem-native.git
    git_commit: 0ba906cb14b1c241476134d7403a811b382ca498
    patches: [mlkem-native-exclude-ppc64le.patch]

  cupqc:
    # NOTE: sources type: files
    git_url: https://github.com/open-quantum-safe/liboqs-cupqc-meta.git
    git_commit: b026f4e5475cd9c20c2082c7d9bad80e5b0ba89e

  icicle:
    # NOTE: sources type: files
    git_url: https://github.com/ingonyama-zk/icicle-liboqs.git
    git_commit: 4ea3e612ff26e3e72b5e5bcfff4cf3dda45dc0a8

  mldsa-native:
    # NOTE: sources type: recursive
    git_url: https://github.com/pq-code-package/mldsa-native.git
    git_commit: 9b0ee84f4cf399043eca59eca4e5f8531ca1d61b

  pqmayo:
    # NOTE: sources type: files
    git_url: https://github.com/PQCMayo/MAYO-C.git
    git_commit: 64e15c622dec1f59aa5bbaf7f7c8f4f20af75106
    patches: [pqmayo-aes.patch, pqmayo-mem.patch]

  upcross:
    # NOTE: sources type: files
    git_url: https://github.com/CROSS-signature/CROSS-lib-oqs.git
    git_commit: 179d61b8b59e524fba86954f7fa269495650030a

  pqov:
    # NOTE: sources type: files
    git_url: https://github.com/pqov/pqov.git
    git_commit: 33fa5278754a32064c55901c3a17d48b06cc2351

  snova:
    # NOTE: sources type: files
    git_url: https://github.com/vacuas/SNOVA-OQS
    git_commit: 1c3ca6f4f7286c0bde98d7d6f222cf63b9d52bff
    patches: [snova-unused-param.patch]

  mqom:
    # NOTE: sources type: files with common
    git_url: https://github.com/mqom/mqom-v2.git
    git_commit: ec6b7fa86e232a25f8b2f151a4b4eebb8e81b5e7

# TODO: is it better to separate `kems` from `sigs`, or to have all algorithm
#       families listed under a single `families` field and specify each
#       family's algorithm type under `<family>.<algtype>`?
algfamilies:
  # NOTE: family key must follow snake case because it serves as default dir
  classic_mceliece:
    display_name: Classic McEliece
    # NOTE: algtype is an enum: kem, sig, or stfl_sig
    algtype: kem
    principal-submitters:
      - Daniel J. Bernstein
      - Tung Chou
      - Tanja Lange
      - Ingo von Maurich
      - Rafael Misoczki
      - Ruben Niederhagen
      - Edoardo Persichetti
      - Christiane Peters
      - Peter Schwabe
      - Nicolas Sendrier
      - Jakub Szefer
      - Wen Wang
    # NOTE: auxiliary-submitters is an optional list of strings. If it is not
    #       specified in the datasheet, then it defaults to an empty list at
    #       parsing
    # auxiliary-submitters: []
    crypto-assumption: >-
      Niederreiter's dual version of McEliece's public key encryption using
      binary Goppa codes
    website: https://classic.mceliece.org
    # TODO: nist-round really should fold into standardization-status
    nist-round: 3
    spec-version: SUPERCOP-20221025
    standardization-status:
      Under [ISO](https://classic.mceliece.org/iso.html) consideration
    upstream-maintenance: No active maintenance
    upstream-statement-url:
      https://github.com/PQClean/PQClean/blob/dca1ee2/README.md
    # NOTE: primary-upstream uses an upstream_key
    primary-upstream: pqclean
    # TODO: default-upstream-id does not make sense
    # default-upstream-id: clean
    oqs-support-tier: 3
    # TODO: upstream-ancestors also does not make sense
    upstream-ancestors:
      - SUPERCOP-20221025 "clean" and "avx2" implementations
    advisories:
      - >
        Classic-McEliece-460896, Classic-McEliece-460896f,
        Classic-McEliece-6960119, and Classic-McEliece-6960119f parameter sets
        fail memory leak testing on x86-64 when building with ``clang`` using
        optimization level ``-O2`` and ``-O3``. Care is advised when using the
        algorithm at higher optimization levels, and any other compiler and
        architecture.
      - >
        Current implementation of the algorithm may not be constant-time.
        Additionally, environment specific constant-time leaks may not be
        documented; please report potential constant-time leaks when found.
    parameter-sets:
      mceliece348864:
        claimed-nist-level: 1
        claimed-security: IND-CCA2
        length-public-key: 261120
        length-ciphertext: 96
        length-secret-key: 6492
        length-shared-secret: 32
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        # TODO: implementations-...-features might not best be located here
        implementations-switch-on-runtime-cpu-features: true
        # TODO: I put default-implementation under parameter-set instead of
        #       under implementation for clarity. When default is under
        #       parameter set, it is easier to see which implementation is the
        #       default implementation.
        default-implementation: clean
        implementations:
          clean:
            upstream: pqclean
            # NOTE: one of portable|x86_64|arm64
            uarch: portable
            common-crypto:
              - AES: liboqs
              - SHA3: liboqs
            no-secret-dependent-branching-claimed: false
            no-secret-dependent-branching-checked-by-valgrind: false
            # TODO: this could be more precise
            large-stack-usage: true
          pqclean_mceliece348864_avx2:
            uarch: x86_64
            required_flags: [avx2, popcnt]
            # TODO: why does it have to do with OS?
            operating_systems: [Linux, Darwin]
      mceliece348864f:
        claimed-nist-level: 1
        claimed-security: IND-CCA2
        length-public-key: 261120
        length-ciphertext: 96
        length-secret-key: 6492
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece460896:
        claimed-nist-level: 3
        claimed-security: IND-CCA2
        length-public-key: 524160
        length-ciphertext: 156
        length-secret-key: 13608
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece460896f:
        claimed-nist-level: 3
        claimed-security: IND-CCA2
        length-public-key: 524160
        length-ciphertext: 156
        length-secret-key: 13608
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece6688128:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1044992
        length-ciphertext: 208
        length-secret-key: 13932
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece6688128f:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1044992
        length-ciphertext: 208
        length-secret-key: 13932
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece6960119:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1047319
        length-ciphertext: 194
        length-secret-key: 13948
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece6960119f:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1047319
        length-ciphertext: 194
        length-secret-key: 13948
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece8192128:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1357824
        length-ciphertext: 208
        length-secret-key: 14120
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
      mceliece8192128f:
        claimed-nist-level: 5
        claimed-security: IND-CCA2
        length-public-key: 1357824
        length-ciphertext: 208
        length-secret-key: 14120
        length-shared-secret: 32
        implementations-switch-on-runtime-cpu-features: true
    # TODO: I chose to nest implementations under {{ family_key }} instead of
    #       {{ param_key }} to reduce the number of indentations, but I did not
    #       make implementations a top-level key because then there needs to be
    #       a large number of unique {{ impl_key }} under the top-level
    #       "implementations" key. {{ impl_key }} also serves as subdir name.
    implementations:
      pqclean_mceliece348864_avx2:
        upstream: pqclean
        # TODO: what are the possible ways to specify upstreams?
        #       - directory:
        #         A single directory, no nested sub-directory anywhere. This
        #         includes PQClean and pqcrystals-kyber. The source directory
        #         might have miscellaneous stuff we don't want to copy.
        #       - files:
        #         A list of individual files, no nested sub-directory at
        #         destination. For example, with pqc-hqc, source files are
        #         scattered across src/ref and src/common, but they are copied
        #         into a single directory under src/kem/hqc/{{ impl_key }}.
        #       - recursive:
        #         A list of files with nested sub-directory at destination. This
        #         includes mlkem-native and mldsa-native. In both cases the
        #         integration META.yml file lists individual files, but they
        #         were copied while preserving their nested paths. The nested
        #         paths were baked into `#include` directives, so it's not easy
        #         to convert.
        #       - common:
        #         common source files used across multiple implementations
        # FIX: figure out how to represent common source files used across many
        #      implementations
        # NOTE: where {{ impl_key }}.sources points to a single directory?
        sources: crypto_kem/mceliece348864/avx2
        version: SUPERCOP-20221025
        # NOTE: uarch is optional and defaults to "portable"
        uarch: x86_64
        operating_systems: ["Linux", "Darwin"]
        required_flags: [avx2, popcnt]
      pqclean_mceliece348864_clean:
      pqclean_mceliece348864f_avx2:
      pqclean_mceliece348864f_clean:
      pqclean_mceliece460896_avx2:
      pqclean_mceliece460896_clean:
      pqclean_mceliece460896f_avx2:
      pqclean_mceliece460896f_clean:
      pqclean_mceliece6688128_avx2:
      pqclean_mceliece6688128_clean:
      pqclean_mceliece6688128f_avx2:
      pqclean_mceliece6688128f_clean:
      pqclean_mceliece6960119_avx2:
      pqclean_mceliece6960119_clean:
      pqclean_mceliece6960119f_avx2:
      pqclean_mceliece6960119f_clean:
      pqclean_mceliece8192128_avx2:
      pqclean_mceliece8192128_clean:
      pqclean_mceliece8192128f_avx2:
      pqclean_mceliece8192128f_clean:

  hqc:
  kyber:
  ml_kem:

  ml_dsa:
    display_name: ML-DSA
    algtype: sig
    principal-submitters:
      - Vadim Lyubashevsky
    auxiliary-submitters:
      - Shi Bai
      - Léo Ducas
      - Eike Kiltz
      - Tancrède Lepoint
      - Peter Schwabe
      - Gregor Seiler
      - Damien Stehlé
    crypto-assumption: hardness of lattice problems over module lattices
    website:
      https://pq-crystals.org/dilithium/ and https://csrc.nist.gov/pubs/fips/204/final
    nist-round: FIPS204
    standardization-status:
      Standardized by [NIST](https://csrc.nist.gov/pubs/fips/204/final)
    upstream-maintenance: Actively maintained
    upstream-statement-url: https://github.com/pq-code-package/mldsa-native
    oqs-support-tier: 2
    spec-version: ML-DSA
    primary-upstream: mldsa-native
    parameter-sets:
      ml-dsa-44:
        claimed-nist-level: 2
        claimed-security: SUF-CMA
        length-public-key: 1312
        length-secret-key: 2560
        length-signature: 2420
        length-mu: 64
        nistkat-sha256:
          9a196e7fb32fbc93757dc2d8dc1924460eab66303c0c08aeb8b798fb8d8f8cf3
        testvectors-sha256:
          5f0d135c0f7fd43f3fb9727265fcd6ec3651eb8c67c04ea5f3d8dfa1d99740d2
        implementations-switch-on-runtime-cpu-features: true
        default-implementation: ref
        implementations:
          ref:
            family: ml_dsa
            parameter-set: ml-dsa-44
            upstream: mldsa-native
            uarch: portable
            common-crypto:
              - SHA3: liboqs
            no-secret-dependent-branching-claimed: true
            no-secret-dependent-branching-checked-by-valgrind: true
            large-stack-usage: false
            folder_name: .
            compile_opts:
              - -DMLD_CONFIG_PARAMETER_SET=44
              - -DMLD_CONFIG_FILE="integration/liboqs/config_c.h"
            signature_keypair: PQCP_MLDSA_NATIVE_MLDSA44_C_keypair_oqs
            signature_signature: PQCP_MLDSA_NATIVE_MLDSA44_C_signature_oqs
            signature_verify: PQCP_MLDSA_NATIVE_MLDSA44_C_verify_oqs
            signature_signature_extmu: PQCP_MLDSA_NATIVE_MLDSA44_C_signature_extmu_oqs
            signature_verify_extmu: PQCP_MLDSA_NATIVE_MLDSA44_C_verify_extmu_oqs
            api-with-context-string: true
            sources: [integration/liboqs/config_c.h,
              integration/liboqs/fips202_glue.h,
              integration/liboqs/fips202x4_glue.h,
              integration/liboqs/sig_glue.c,
              mldsa/mldsa_native.h, mldsa/src/cbmc.h, mldsa/src/common.h,
              mldsa/src/context.h, mldsa/src/ct.c, mldsa/src/ct.h,
              mldsa/src/debug.c, mldsa/src/debug.h, mldsa/src/packing.c,
              mldsa/src/packing.h, mldsa/src/params.h, mldsa/src/poly.c,
              mldsa/src/poly.h, mldsa/src/poly_kl.c, mldsa/src/poly_kl.h,
              mldsa/src/polyvec.c, mldsa/src/polyvec.h,
              mldsa/src/polyvec_lazy.c, mldsa/src/polyvec_lazy.h,
              mldsa/src/randombytes.h, mldsa/src/reduce.h,
              mldsa/src/rounding.h, mldsa/src/sign.c, mldsa/src/sign.h,
              mldsa/src/symmetric.h, mldsa/src/sys.h, mldsa/src/zetas.inc]
      ml-dsa-65:
        claimed-nist-level: 3
        claimed-security: SUF-CMA
        length-public-key: 1952
        length-secret-key: 4032
        length-signature: 3309
        implementations-switch-on-runtime-cpu-features: true
      ml-dsa-87:
        claimed-nist-level: 5
        claimed-security: SUF-CMA
        length-public-key: 2592
        length-secret-key: 4896
        length-signature: 4627
        implementations-switch-on-runtime-cpu-features: true


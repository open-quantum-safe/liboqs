# @summary    A map from family key to algorithm family metadata. Family key
#             must follow snake casing because it serves as default dir
algfamilies:
  demo_alg:
    displayname: Required
    algtype: kem, sig, or stfl_sig
    principal-submitters:
      - Non-empty List
    auxiliary-submitters:
      - Optional, defaults to empty list
    crypto-assumption: >-
      A single line summarizing the core hard problem
    website: >-
      Required
    # TODO: what are the possible values
    nist-round: Required
    spec-version: Required
    standardization-status: Required
    upstream-maintenance: Required
    upstream-statement-url: null
    primary-upstream: upstream_key
    # TODO: What does default-upstream-id do?
    # default-upstream-id: clean
    oqs-support-tier: 1, 2, or 3
    # TODO: What does upstream-ancestors do?
    upstream-ancestors: null
    advisories: null
    parameters:

      param1: # for kem
        security-strength: 1, 2, 3, 4, or 5
        security-model: IND-CCA2
        length-public-key: 261120
        length-ciphertext: 96
        length-secret-key: 6492
        length-shared-secret: 32
        length-keypair-seed: null
        length-encaps-seed: null
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        enable_by: C/CMake macro
        default-implementation: optional, impl_key, must be portable
        memopt-implementation: null

      param2: # for sig
        security-strength: 1
        security-model: EUF-CMA
        length-public-key: 60
        length-secret-key: 88
        length-signature: 3280
        length-mu: 64
        nistkat-sha256:
          6f0f50626df15ce403c0c1d5f91648245282afebcac90e5db3595ce9b20b1817
        enable_by: OQS_ENABLE_SIG_mqom_mqom2_cat1_gf16_fast_r5
        default-implementation: mqom2_cat1_gf16_fast_r5_default
        memopt-implementation: mqom2_cat1_gf16_fast_r5_memopt
    common_src:  # defaults to null
      common_key:
        upstream: upstream_key
        destdir: null # defaults to common_key
        upstream_base_dir: null  # defaults to root directory
        files: [
          "*.c",         # can match wildcard
          "some/dir",    # copy the entire directory
          "other/dir/",  # copy the content
        ]
    implementations-switch-on-runtime-cpu-features: true  # defaults to true
    implementations:

      demo_impl_local:
        version: Required
        enable_by: Optional
        subdirname: impl_key
        parameter: param_key
        uarch: portable, x86_64, arm_8
        common-crypto:
          AES: liboqs
          SHA3: liboqs
        no-secret-dependent-branching-claimed: false
        no-secret-dependent-branching-checked-by-valgrind: false
        large-stack-usage: true
        os: Defaults to []
        cpufeatures: Defaults to []
        sources:
          - upstream: upstream_key
            base_dir: null  # defaults to root
            preserve_subdirs: false  # defaults to false
            # TODO: this only specifies the files to copy, but it is not an
            #       exact list of source files. For example, "LICENSE" should be
            #       excluded from compilation sources
            files: [
              "*.c",         # can match wildcard
              "some/dir",    # copy the entire directory
              "other/dir/",  # copy the content
            ]
          - family_common: family_common_key
        includes:
          - scope: private, public, or interface
            dir: "literal string, directly copied into target_include_directories "
        old_gas_syntax_if_darwin: false  # defaults to false
        compile_opts:
          - scope: private, public, or interface
            opts: "literal string directly copied into target_compile_options"
        link_libs: [libname]
        set_properties:  # https://cmake.org/cmake/help/latest/command/set_property.html
          - scope: target
            name: CUDA_ARCHITECTURES
            value: OFF
        # kem API
        signature_keypair: null
        signature_enc: null
        signature_dec: null
        signature_keypair_derand: null
        signature_enc_derand: null
        # sig API
        signature_keypair: null
        signature_signature: null
        signature_verify: null
        signature_signature_extmu: null
        signature_verify_extmu: null

      demo_impl_remote:  # remote, could be kem or sig
        upstream: upstream_key
        remote_meta_path: must be explicit, no templating
        remote_impl_key: the impl_key under remote meta's implementations

  bike:
    displayname: BIKE
    algtype: kem
    principal-submitters:
      - Nicolas Aragon
      - Paulo Barreto
      - Slim Bettaieb
      - Loic Bidoux
      - Olivier Blazy
      - Jean-Christophe Deneuville
      - Phillipe Gaborit
      - Santosh Gosh
      - Shay Gueron
      - Tim Güneysu
      - Carlos Aguilar Melchor
      - Rafael Misoczki
      - Edoardo Persichetti
      - Nicolas Sendrier
      - Jean-Pierre Tillich
      - Valentin Vasseur
      - Gilles Zémor
    crypto-assumption: >-
      QC-MDPC (Quasi-Cyclic Moderate Density Parity-Check)
    website: http://bikesuite.org/
    nist-round: "4"
    spec-version: "5.1"
    standardization-status: >-
      Not selected by [NIST](https://bikesuite.org/files/v5.1/BIKE_Spec.2022.10.10.1.pdf)
    upstream-maintenance: TBD
    upstream-statement-url: null
    primary-upstream: awslabs/bike-kem
    # TODO: What does default-upstream-id do?
    # default-upstream-id: clean
    oqs-support-tier: 3
    # TODO: What does upstream-ancestors do?
    upstream-ancestors:
      - https://bikesuite.org/files/v5.0/Reference_Implementation.2022.10.04.1.zip
    advisories: null

    parameters:
      bike-l1:
        security-strength: 1
        security-model: IND-CCA2
        length-public-key: 1541
        length-ciphertext: 1573
        length-secret-key: 5223
        length-shared-secret: 32
        nistkat-sha256: null
        enable_by: OQS_ENABLE_KEM_bike_l1


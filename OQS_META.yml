  ml_kem:
    displayname: ML-KEM
    algtype: kem
    principal-submitters:
      - Peter Schwabe
    auxiliary-submitters:
      - Roberto Avanzi
      - Joppe Bos
      - Léo Ducas
      - Eike Kiltz
      - Tancrède Lepoint
      - Vadim Lyubashevsky
      - John M. Schanck
      - Gregor Seiler
      - Damien Stehlé
    crypto-assumption: >-
      Module LWE+R with base ring Z[x]/(3329, x^256+1)
    website: >-
      https://pq-crystals.org/kyber/ and https://csrc.nist.gov/pubs/fips/203
    nist-round: FIPS203
    spec-version: ML-KEM
    standardization-status: >-
      Standardized by [NIST](https://csrc.nist.gov/pubs/fips/203/final)
    upstream-maintenance: Actively maintained
    upstream-statement-url: https://github.com/pq-code-package/mlkem-native
    primary-upstream: mlkem-native
    oqs-support-tier: 1
    parameters:

      ml_kem_512:
        security-strength: 1
        security-model: IND-CCA2
        length-public-key: 800
        length-ciphertext: 768
        length-secret-key: 1632
        length-shared-secret: 32
        length-keypair-seed: 64
        length-encaps-seed: 32
        nistkat-sha256:
          c70041a761e01cd6426fa60e9fd6a4412c2be817386c8d0f3334898082512782
        enable_by: OQS_ENABLE_KEM_ml_kem_512
        default-implementation: ml_kem_512_ref

      ml_kem_768:
        security-strength: 3
        security-model: IND-CCA2
        length-public-key: 1184
        length-ciphertext: 1088
        length-secret-key: 2400
        length-shared-secret: 32
        length-keypair-seed: 64
        length-encaps-seed: 32
        nistkat-sha256:
          5352539586b6c3df58be6158a6250aeff402bd73060b0a3de68850ac074c17c3
        enable_by: OQS_ENABLE_KEM_ml_kem_768
        default-implementation: ml_kem_768_ref

      ml_kem_1024:
        security-strength: 5
        security-model: IND-CCA2
        length-public-key: 1568
        length-ciphertext: 1568
        length-secret-key: 3168
        length-shared-secret: 32
        length-keypair-seed: 64
        length-encaps-seed: 32
        nistkat-sha256:
          f580d851e5fb27e6876e5e203fa18be4cdbfd49e05d48fec3d3992c8f43a13e6
        enable_by: OQS_ENABLE_KEM_ml_kem_1024
        default-implementation: ml_kem_1024_ref

    implementations:
      ml_kem_512_ref:
        version: FIPS203
        enable_by: null  # default impl of ml-kem-512
        subdirname: mlkem-native_ml-kem-512_ref
        parameter: ml_kem_512
        uarch: portable
        common-crypto:
          SHA3: liboqs
        no-secret-dependent-branching-claimed: true
        no-secret-dependent-branching-checked-by-valgrind: true
        large-stack-usage: false
        sources:
          - upstream: mlkem-native
            preserve_subdirs: true
            files: [integration/liboqs/config_c.h,
                    integration/liboqs/fips202_glue.h,
                    integration/liboqs/fips202x4_glue.h,
                    integration/liboqs/kem_glue.c,
                    mlkem/src/cbmc.h, mlkem/src/common.h, mlkem/src/compress.c,
                    mlkem/src/compress.h, mlkem/src/context.h,
                    mlkem/src/debug.c, mlkem/src/debug.h, mlkem/src/indcpa.c,
                    mlkem/src/indcpa.h, mlkem/src/kem.c, mlkem/src/kem.h,
                    mlkem/src/native/api.h, mlkem/src/native/meta.h,
                    mlkem/src/params.h, mlkem/src/poly.c, mlkem/src/poly.h,
                    mlkem/src/poly_k.c, mlkem/src/poly_k.h, mlkem/src/zetas.inc,
                    mlkem/src/randombytes.h, mlkem/src/sampling.c,
                    mlkem/src/sampling.h, mlkem/src/symmetric.h,
                    mlkem/src/sys.h, mlkem/src/verify.c, mlkem/src/verify.h]
        includes:
          - scope: private
            dir: "${CMAKE_CURRENT_LIST_DIR}/mlkem-native_ml-kem-512_ref"
          - scope: private
            dir: "${PROJECT_SOURCE_DIR}/src/common/pqclean_shims"
        compile_opts:
          - scope: public
            opts: >-
              -DMLK_CONFIG_PARAMETER_SET=512
              -DMLK_CONFIG_FILE="../../integration/liboqs/config_c.h"
        signature_keypair: PQCP_MLKEM_NATIVE_MLKEM512_C_keypair
        signature_enc: PQCP_MLKEM_NATIVE_MLKEM512_C_enc
        signature_dec: PQCP_MLKEM_NATIVE_MLKEM512_C_dec
        signature_keypair_derand: PQCP_MLKEM_NATIVE_MLKEM512_C_keypair_derand
        signature_enc_derand: PQCP_MLKEM_NATIVE_MLKEM512_C_enc_derand

      ml_kem_512_aarch64:
        version: FIPS203
        enable_by: OQS_ENABLE_KEM_ml_kem_512_aarch64
        parameter: ml_kem_512
        subdirname: mlkem-native_ml-kem-512_aarch64
        uarch: arm_8
        common-crypto:
          SHA3: liboqs
        no-secret-dependent-branching-claimed: true
        no-secret-dependent-branching-checked-by-valgrind: true
        large-stack-usage: false
        os: [Linux, Darwin]
        cpufeatures: [asimd]
        sources:
          - upstream: mlkem-native
            preserve_subdirs: true
            files: [integration/liboqs/config_aarch64.h,
                    integration/liboqs/fips202_glue.h,
                    integration/liboqs/fips202x4_glue.h,
                    integration/liboqs/kem_glue.c,
                    mlkem/src/cbmc.h,
                    mlkem/src/common.h, mlkem/src/compress.c,
                    mlkem/src/compress.h, mlkem/src/context.h,
                    mlkem/src/debug.c, mlkem/src/debug.h, mlkem/src/indcpa.c,
                    mlkem/src/indcpa.h, mlkem/src/kem.c, mlkem/src/kem.h,
                    mlkem/src/native/api.h, mlkem/src/native/meta.h,
                    mlkem/src/params.h, mlkem/src/poly.c, mlkem/src/poly.h,
                    mlkem/src/poly_k.c, mlkem/src/poly_k.h,
                    mlkem/src/randombytes.h, mlkem/src/sampling.c,
                    mlkem/src/sampling.h, mlkem/src/symmetric.h,
                    mlkem/src/sys.h, mlkem/src/verify.c, mlkem/src/verify.h,
                    mlkem/src/zetas.inc,
                    mlkem/src/native/aarch64/meta.h,
                    mlkem/src/native/aarch64/README.md,
                    mlkem/src/native/aarch64/src/*,
            ]
        includes:
          - scope: private
            dir: "${CMAKE_CURRENT_LIST_DIR}/mlkem-native_ml-kem-512_aarch64"
          - scope: private
            dir: "${PROJECT_SOURCE_DIR}/src/common/pqclean_shims"
        compile_opts:
          - scope: public
            opts: >-
              -DMLK_CONFIG_PARAMETER_SET=512
              -DMLK_CONFIG_FILE="../../integration/liboqs/config_aarch64.h"
        signature_keypair: PQCP_MLKEM_NATIVE_MLKEM512_AARCH64_keypair
        signature_enc: PQCP_MLKEM_NATIVE_MLKEM512_AARCH64_enc
        signature_dec: PQCP_MLKEM_NATIVE_MLKEM512_AARCH64_dec
        signature_keypair_derand: PQCP_MLKEM_NATIVE_MLKEM512_AARCH64_keypair_derand
        signature_enc_derand: PQCP_MLKEM_NATIVE_MLKEM512_AARCH64_enc_derand

      ml_kem_512_x86_64:
        version: FIPS203
        enable_by: OQS_ENABLE_KEM_ml_kem_512_x86_64
        parameter: ml_kem_512
        subdirname: mlkem-native_ml-kem-512_x86_64
        uarch: x86_64
        common-crypto:
          SHA3: liboqs
        no-secret-dependent-branching-claimed: true
        no-secret-dependent-branching-checked-by-valgrind: true
        large-stack-usage: false
        os: [Linux, Darwin]
        cpufeatures: [avx2, bmi2, popcnt]
        sources:
          - upstream: mlkem-native
            preserve_subdirs: true  # defaults to false
            files: [integration/liboqs/config_x86_64.h,
                    integration/liboqs/fips202_glue.h,
                    integration/liboqs/fips202x4_glue.h,
                    integration/liboqs/kem_glue.c,
                    mlkem/src/cbmc.h, mlkem/src/common.h, mlkem/src/compress.c,
                    mlkem/src/compress.h, mlkem/src/context.h,
                    mlkem/src/debug.c, mlkem/src/debug.h, mlkem/src/indcpa.c,
                    mlkem/src/indcpa.h, mlkem/src/kem.c, mlkem/src/kem.h,
                    mlkem/src/native/api.h, mlkem/src/native/meta.h,
                    mlkem/src/params.h, mlkem/src/poly.c, mlkem/src/poly.h,
                    mlkem/src/poly_k.c, mlkem/src/poly_k.h,
                    mlkem/src/randombytes.h, mlkem/src/sampling.c,
                    mlkem/src/sampling.h, mlkem/src/symmetric.h,
                    mlkem/src/sys.h, mlkem/src/verify.c, mlkem/src/verify.h,
                    mlkem/src/zetas.inc, mlkem/src/native/x86_64/meta.h,
                    mlkem/src/native/x86_64/README.md,
                    mlkem/src/native/x86_64/src/*]
        includes:
          - scope: private
            dir: "${CMAKE_CURRENT_LIST_DIR}/mlkem-native_ml-kem-512_x86_64"
          - scope: private
            dir: "${PROJECT_SOURCE_DIR}/src/common/pqclean_shims"
        compile_opts:
          - scope: private
            opts: "-mavx2 -mbmi2 -mpopcnt"
          - scope: public
            opts: >-
              -DMLK_CONFIG_PARAMETER_SET=512
              -DMLK_CONFIG_FILE="../../integration/liboqs/config_x86_64.h"
        signature_keypair: PQCP_MLKEM_NATIVE_MLKEM512_X86_64_keypair
        signature_enc: PQCP_MLKEM_NATIVE_MLKEM512_X86_64_enc
        signature_dec: PQCP_MLKEM_NATIVE_MLKEM512_X86_64_dec
        signature_keypair_derand: PQCP_MLKEM_NATIVE_MLKEM512_X86_64_keypair_derand
        signature_enc_derand: PQCP_MLKEM_NATIVE_MLKEM512_X86_64_enc_derand

      ml_kem_512_cuda:
        version: FIPS203
        enable_by: OQS_ENABLE_KEM_ml_kem_512_cuda
        parameter: ml_kem_512
        subdirname: cupqc_ml-kem-512_cuda
        uarch: cuda
        no-secret-dependent-branching-claimed: false
        no-secret-dependent-branching-checked-by-valgrind: false
        large-stack-usage: false
        os: [Linux, Darwin]
        sources:
          - upstream: cupqc
            files: [cuda/ml-kem-512/cupqc_ml-kem.cu]
        compile_opts:
          - scope: private
            opts: "$<$<COMPILE_LANGUAGE:CUDA>:-rdc=true -dlto -arch=compute_70>"
        link_libs:
          - scope: public
            libs: "cupqc"
        set_properties:
          - scope: target
            name: CUDA_ARCHITECTURES
            value: "OFF"
        signature_keypair: cupqc_ml_kem_512_keypair
        signature_enc: cupqc_ml_kem_512_enc
        signature_dec: cupqc_ml_kem_512_dec

      ml_kem_512_icicle_cuda:
        version: FIPS203
        enable_by: OQS_ENABLE_KEM_ml_kem_512_icicle_cuda

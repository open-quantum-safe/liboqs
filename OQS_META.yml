  hqc:
    displayname: HQC
    algtype: kem
    principal-submitters:
      - Philippe Gaborit
    auxiliary-submitters:
      - Carlos Aguilar-Melchor
      - Nicolas Aragon
      - Slim Bettaieb
      - Loïc Bidoux
      - Olivier Blazy
      - Jean-Christophe Deneuville
      - Edoardo Persichetti
      - Gilles Zémor
      - Jurjen Bos
      - Arnaud Dion
      - Jérôme Lacan
      - Jean-Marc Robert
      - Pascal Véron
      - Paulo L. Barreto
      - Santosh Ghosh
      - Shay Gueron
      - Tim Güneysu
      - Rafael Misoczki
      - Jan Richter-Brokmann
      - Nicolas Sendrier
      - Jean-Pierre Tillich
      - Valentin Vasseur
    crypto-assumption: >-
      Syndrome decoding of structure codes (Hamming Quasi-Cyclic)
    website: https://pqc-hqc.org/
    nist-round: "4"
    spec-version: "2025-08-22"
    standardization-status: >-
      Selected by [NIST](https://pqc-hqc.org/doc/hqc_specifications_2025_08_22.pdf)
      for upcoming standardization
    upstream-maintenance: TBD
    upstream-statement-url: null
    primary-upstream: pqc-hqc
    oqs-support-tier: 2
    upstream-ancestors:
      - https://gitlab.com/pqc-hqc
      - submission 2025-08-22 at https://pqc-hqc.org/implementation.html
    advisories: null

    parameters:
      hqc-1:
        security-strength: 1
        security-model: IND-CCA2
        length-public-key: 2241
        length-ciphertext: 4433
        length-secret-key: 2321
        length-shared-secret: 32
        # NOTE: for test_kat (1 test case):
        # head -8 kats/ref/hqc-1/PQCkemKAT_2321.rsp | tail -6 | sha256sum
        # for test_kat_all (100 test cases):
        # head -701 kats/ref/hqc-1/PQCkemKAT_2321.rsp | tail -699 | sha256sum
        nistkat-sha256:
          0f1f4fd014b32492ec6490d2ad9e9f75ccc0c2b27d72f34918c7f73f9698c2e4
        enable_by: OQS_ENABLE_KEM_hqc_1
        default-implementation: pqc-hqc_hqc-1_ref
        memopt-implementation: null

      hqc-3:
        security-strength: 3
        security-model: IND-CCA2
        length-ciphertext: 8978
        length-public-key: 4514
        length-secret-key: 4602
        length-shared-secret: 32
        # NOTE: for test_kat (one test case):
        # head -8 kats/ref/hqc-3/PQCkemKAT_4602.rsp | tail -6 | sha256sum
        # for test_kat_all (100 test cases):
        # head -701 kats/ref/hqc-3/PQCkemKAT_4602.rsp | tail -699 | sha256sum
        nistkat-sha256:
          b88d4cfe517446854b5d3c85e6602518a526c5eb95571348ce4ab5915faa05b6
        enable_by: OQS_ENABLE_KEM_hqc_3
        default-implementation: pqc-hqc_hqc-3_ref
        memopt-implementation: null


name: Tests for all supported platforms

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      stage:
        description: CI stage of the platform matrix to run (pr or main)
        type: string
        default: main
  workflow_dispatch:
    inputs:
      stage:
        description: CI stage of the platform matrix to run
        type: choice
        options: [pr, main]
        default: main

jobs:
  matrix-tests:
    uses: ./.github/workflows/platform-matrix.yml
    with:
      stage: ${{ inputs.stage }}

  # Platforms and configurations with steps beyond build-and-test.

  android-tests:
    uses: ./.github/workflows/android.yml

  ios-tests:
    uses: ./.github/workflows/apple.yml

  linux-tests:
    uses: ./.github/workflows/linux.yml

  zephyr-tests:
    uses: ./.github/workflows/zephyr.yml

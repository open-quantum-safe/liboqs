name: Push tests

permissions:
  contents: read

on:
  push:
    branches-ignore: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  basic-checks:
    uses: ./.github/workflows/basic.yml
    permissions:
      contents: read
      id-token: write  # required by nixflakecheck's magic-nix-cache-action
      actions: write   # required to cancel the run on fail-fast (see basic.yml)

  full-tests:
    needs: basic-checks
    if: contains( github.event.head_commit.message, '[full tests]' )
    uses: ./.github/workflows/platforms.yml

  extended-tests:
    needs: basic-checks
    if: contains( github.event.head_commit.message, '[extended tests]' )
    uses: ./.github/workflows/extended.yml

  code-coverage-tests:
    needs: basic-checks
    if: contains( github.event.head_commit.message, '[code coverage]' )
    uses: ./.github/workflows/code-coverage.yml

  downstream-release-tests:
    needs: basic-checks
    if: contains( github.event.head_commit.message, '[trigger downstream]' )
    uses: ./.github/workflows/downstream-release.yml
    secrets: inherit

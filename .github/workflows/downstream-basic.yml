name: Trigger basic downstream CI

permissions:
  contents: read

on: [workflow_call, workflow_dispatch]

jobs:

  trigger-downstream-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      # One failing downstream must not stop the checks for the others
      # (replaces the old per-step `if: ${{ !cancelled() }}`).
      fail-fast: false
      matrix:
        include:
          - name: boringssl
            repo: open-quantum-safe/boringssl
            trigger: repository_dispatch
          - name: openssh
            repo: open-quantum-safe/openssh
            trigger: workflow_dispatch
            workflow: ubuntu.yaml
            ref: OQS-v9
          - name: liboqs-cpp
            repo: open-quantum-safe/liboqs-cpp
            trigger: repository_dispatch
          - name: liboqs-go
            repo: open-quantum-safe/liboqs-go
            trigger: repository_dispatch
          - name: liboqs-python
            repo: open-quantum-safe/liboqs-python
            trigger: repository_dispatch
          - name: liboqs-java
            repo: open-quantum-safe/liboqs-java
            trigger: repository_dispatch
          - name: liboqs-rust
            repo: open-quantum-safe/liboqs-rust
            trigger: repository_dispatch
          # oqs-provider no longer uses CircleCI, and none of its CI
          # workflows currently expose a repository_dispatch or
          # workflow_dispatch trigger (only release.yml listens, for
          # "liboqs-release"). Re-enable this entry once such a trigger
          # is added to oqs-provider:
          # - name: oqs-provider
          #   repo: open-quantum-safe/oqs-provider
          #   trigger: repository_dispatch
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
      - name: Trigger ${{ matrix.name }} CI and wait for its result
        env:
          OQSBOT_GITHUB_ACTIONS: ${{ secrets.OQSBOT_GITHUB_ACTIONS }}
        run: |
          python3 scripts/trigger_downstream_ci.py \
            --repo "${{ matrix.repo }}" \
            --trigger-type "${{ matrix.trigger }}" \
            --event-type "liboqs-upstream-trigger" \
            --workflow "${{ matrix.workflow || '' }}" \
            --ref "${{ matrix.ref || 'main' }}" \
            --timeout 2700

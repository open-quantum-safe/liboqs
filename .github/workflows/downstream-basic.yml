name: Trigger basic downstream CI

permissions:
  contents: read

on: [workflow_call, workflow_dispatch]

jobs:

  trigger-downstream-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OQS-BoringSSL CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/boringssl/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger OQS-OpenSSH CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"ref":"OQS-v9"}' \
               https://api.github.com/repos/open-quantum-safe/openssh/actions/workflows/ubuntu.yaml/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger oqs-provider CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --user ${{ secrets.BUILD_TRIGGER_TOKEN }}: \
               --request POST \
               --header "Content-Type: application/json" \
               --data '{ "branch": "main" }' \
               https://circleci.com/api/v2/project/gh/open-quantum-safe/oqs-provider/pipeline)
          cat response_body
          test "$response_code" = "201"
          pipeline_state=$(jq -r '.state' response_body)
          test "$pipeline_state" != "errored"
      - name: Trigger liboqs-cpp CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/liboqs-cpp/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger liboqs-go CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/liboqs-go/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger liboqs-python CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/liboqs-python/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger liboqs-java CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/liboqs-java/dispatches)
          cat response_body
          test "$response_code" = "204"
      - name: Trigger liboqs-rust CI
        if: ${{ !cancelled() }} # run all steps independent of failures
        run: |
          response_code=$(curl --silent --show-error \
               --output response_body \
               --write-out "%{response_code}" \
               --request POST \
               --header "Accept: application/vnd.github+json" \
               --header "Authorization: Bearer ${{ secrets.OQSBOT_GITHUB_ACTIONS }}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --data '{"event_type":"liboqs-upstream-trigger"}' \
               https://api.github.com/repos/open-quantum-safe/liboqs-rust/dispatches)
          cat response_body
          test "$response_code" = "204"

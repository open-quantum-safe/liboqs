name: Code coverage tests

permissions:
  contents: read

# The 'scope' input selects what is measured (see CI.md):
# - default: default-enabled algorithms and a fast test subset (PRs, commits to main)
# - full: every algorithm liboqs carries and the full test suite (weekly)
on:
  workflow_call:
    inputs:
      scope:
        description: "Measurement scope: 'default' or 'full'"
        type: string # workflow_call inputs can't be "choice"
        default: default
  workflow_dispatch:
    inputs:
      scope:
        description: "Measurement scope"
        type: choice
        options: [default, full]
        default: default

env:
  DEFAULT_CMAKE_ARGS: -DOQS_ENABLE_SIG_SLH_DSA=OFF
  DEFAULT_TESTS: tests/test_cmdline.py tests/test_kat.py
  # Enable everything that is disabled by default.
  FULL_CMAKE_ARGS: >-
    -DOQS_ENABLE_KEM_CLASSIC_MCELIECE=ON
    -DOQS_ENABLE_SIG_STFL_XMSS=ON
    -DOQS_ENABLE_SIG_STFL_LMS=ON
    -DOQS_HAZARDOUS_EXPERIMENTAL_ENABLE_SIG_STFL_KEY_SIG_GEN=ON
  # Tests that reach library code the others do not. Tests that only repeat
  # covered paths (e.g. test_kat_all, test_mem) run in the regular test workflows.
  FULL_TESTS: >-
    tests/test_cmdline.py
    tests/test_kat.py
    tests/test_acvp_vectors.py
    tests/test_wycheproof_vectors.py
    tests/test_hash.py

jobs:
  coverage:
    name: Run code coverage testing (${{ inputs.scope }}, ${{ matrix.id }})
    strategy:
      matrix:
        include:
          - id: x64-generic
            runner: ubuntu-latest
            CMAKE_ARGS: -DOQS_DIST_BUILD=OFF -DOQS_OPT_TARGET=generic
          - id: x64-distbuild
            runner: ubuntu-latest
            CMAKE_ARGS: -DOQS_DIST_BUILD=ON
          - id: arm64-distbuild
            runner: ubuntu-24.04-arm
            CMAKE_ARGS: -DOQS_DIST_BUILD=ON
    runs-on: ${{ matrix.runner }}
    container: openquantumsafe/ci-ubuntu-latest:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
      - name: Configure
        env:
          SCOPE_CMAKE_ARGS: ${{ inputs.scope == 'full' && env.FULL_CMAKE_ARGS || env.DEFAULT_CMAKE_ARGS }}
        run: |
          mkdir build && cd build && \
          cmake -GNinja -DCMAKE_BUILD_TYPE=Debug -DUSE_COVERAGE=ON ${{ matrix.CMAKE_ARGS }} $SCOPE_CMAKE_ARGS .. && \
          cmake -LA -N ..
      - name: Build
        run: ninja
        working-directory: build
      - name: Run tests
        env:
          OQS_TEST_SIG_CTX_STEP: "255"
          SCOPE_TESTS: ${{ inputs.scope == 'full' && env.FULL_TESTS || env.DEFAULT_TESTS }}
        run: |
          python3 -m pytest --verbose --numprocesses=logical --dist load --maxschedchunk=1 \
          $SCOPE_TESTS
      - name: Run lcov
        run: lcov -d . -c -o lcov.info --exclude /usr/lib,/usr/include --ignore-errors unused,inconsistent
      - name: Upload to coveralls.io
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # pin@v2.3.8
        with:
          flag-name: ${{ matrix.id }}
          parallel: true

  finish:
    needs: coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Finish coveralls.io
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # pin@v2.3.8
        with:
          parallel-finished: true
          carry-forward: "x64-generic,x64-distbuild,arm64-distbuild"

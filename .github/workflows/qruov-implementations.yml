name: QR-UOV implementation coverage

permissions:
  contents: read

on: [workflow_call, workflow_dispatch]

# QR-UOV ships three implementations per parameter set. Which one a build
# actually compiles depends on the option surface and on the platform, and
# nothing else in the tree checks that the intended one was selected: the
# build succeeds and the KATs pass whichever implementation ran, because all
# three produce identical vectors. That is precisely how `opt` came to ship
# for 30 parameter sets without ever being compiled anywhere.
#
# So each job here asserts which implementation the configure step actually
# selected before it runs anything. A job that cannot select its own target
# fails loudly rather than re-testing `ref` under a different name.

jobs:

  qruov:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ref
            # The portable C path, and the default for this family.
            implementation: ref
          - name: avx2
            # The optimised x86-64 path, and the default on Linux x86-64.
            implementation: avx2
          - name: opt
            # Ships but is deliberately not selectable: see
            # tests/test_cmake_option_coverage.py. Reached here only by
            # forcing the cache variables, so that the sources in the tarball
            # are still built and KAT-checked on x86-64 while the ARM64
            # behaviour is investigated.
            implementation: opt
    name: QR-UOV ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: openquantumsafe/ci-ubuntu-latest:latest
    timeout-minutes: 85

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4

      - name: Work out the per-scheme flags for this implementation
        id: flags
        run: |
          set -eu
          schemes=$(grep -oE 'OQS_ENABLE_SIG_qruov_[A-Za-z0-9]+_avx2' .CMake/alg_support.cmake \
                    | sed -e 's/^OQS_ENABLE_SIG_qruov_//' -e 's/_avx2$//' | sort -u)
          count=$(echo "$schemes" | grep -c .)
          if [ "$count" -eq 0 ]; then
            echo "Found no QR-UOV schemes in .CMake/alg_support.cmake" >&2
            exit 1
          fi
          flags=""
          for scheme in $schemes; do
            case "${{ matrix.implementation }}" in
              ref)
                flags="$flags -DOQS_ENABLE_SIG_qruov_${scheme}_avx2=OFF"
                ;;
              avx2)
                flags="$flags -DOQS_ENABLE_SIG_qruov_${scheme}_avx2=ON"
                ;;
              opt)
                # No option declares these, so they are set as plain cache
                # variables. That is a configuration override, not a source
                # change, and it is the only way to reach these sources today.
                flags="$flags -DOQS_ENABLE_SIG_qruov_${scheme}_opt=ON"
                flags="$flags -DOQS_ENABLE_SIG_qruov_${scheme}_avx2=OFF"
                ;;
            esac
          done
          echo "schemes=$count" >> "$GITHUB_OUTPUT"
          echo "cmake_flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Configuring $count QR-UOV schemes for ${{ matrix.implementation }}"

      - name: Configure
        run: |
          mkdir build && cd build
          # shellcheck disable=SC2086
          cmake -GNinja -DOQS_MINIMAL_BUILD="SIG_qruov" ${{ steps.flags.outputs.cmake_flags }} .. \
            && cmake -LA -N ..

      - name: Confirm the intended implementation was selected
        run: |
          set -eu
          header=build/include/oqs/oqsconfig.h
          expected=${{ steps.flags.outputs.schemes }}
          # The base scheme option carries the default implementation, so `ref`
          # is the absence of a per-implementation define rather than a define
          # of its own.
          count_impl () {
            grep -cE "^#define OQS_ENABLE_SIG_qruov_[A-Za-z0-9]+_$1 " "$header" || true
          }
          opt=$(count_impl opt)
          avx2=$(count_impl avx2)
          base=$(grep -cE "^#define OQS_ENABLE_SIG_qruov_[A-Za-z0-9]+ " "$header" || true)
          echo "schemes=$expected base=$base opt=$opt avx2=$avx2"

          if [ "$base" -ne "$expected" ]; then
            echo "Expected $expected QR-UOV schemes enabled, found $base" >&2
            exit 1
          fi

          case "${{ matrix.implementation }}" in
            ref)
              if [ "$opt" -ne 0 ] || [ "$avx2" -ne 0 ]; then
                echo "Wanted ref only, but opt=$opt avx2=$avx2 are also enabled" >&2
                exit 1
              fi
              ;;
            avx2)
              if [ "$avx2" -ne "$expected" ] || [ "$opt" -ne 0 ]; then
                echo "Wanted avx2 for all $expected schemes, got avx2=$avx2 opt=$opt." >&2
                echo "On a runner without AVX2/BMI2/AES this job cannot test avx2." >&2
                exit 1
              fi
              ;;
            opt)
              # The wrapper selects with `#if _opt / #elif _avx2`, so opt wins
              # wherever both are defined. Keeping avx2 off makes the intent
              # explicit rather than relying on that ordering.
              if [ "$opt" -ne "$expected" ] || [ "$avx2" -ne 0 ]; then
                echo "Wanted opt for all $expected schemes, got opt=$opt avx2=$avx2" >&2
                exit 1
              fi
              ;;
          esac

      - name: Build
        run: ninja
        working-directory: build

      - name: Run the QR-UOV KATs
        timeout-minutes: 60
        run: mkdir -p tmp && python3 -m pytest --verbose -k QRUOV tests/test_kat.py tests/test_kat_all.py

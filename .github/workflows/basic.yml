name: Basic checks

permissions:
  contents: read

on: [workflow_call, workflow_dispatch]

jobs:
  workflowcheck:
    name: Check validity of GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/2ab3a12c7848f6c15faca9a92612ef4261d0e370/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/
      - name: Ensure GitHub actions are valid
        run: actionlint -shellcheck "" # run *without* shellcheck

  stylecheck:
    name: Check code formatting
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    container: ghcr.io/baentsch/oqs-ci-ubuntu-latest-slim:latest
    permissions:
      contents: read
      actions: write  # required to cancel the run on failure (fail-fast)
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Ensure code conventions are upheld
        run: python3 -m pytest --verbose tests/test_code_conventions.py
      - name: Check that doxygen can parse the documentation
        run: mkdir build && ./scripts/run_doxygen.sh $(which doxygen) ./docs/.Doxyfile ./build
      - name: Validate CBOM
        run: scripts/validate_cbom.sh
      - name: Cancel run on failure (fail-fast across jobs)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  upstreamcheck:
    name: Check upstream code is properly integrated
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    container: ghcr.io/baentsch/oqs-ci-ubuntu-latest-slim:latest
    permissions:
      contents: read
      actions: write  # required to cancel the run on failure (fail-fast)
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Configure
        run: |
          git config --global user.name "ciuser" && \
          git config --global user.email "ci@openquantumsafe.org" && \
          git config --global --add safe.directory "$PWD" && \
          echo "LIBOQS_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Verify copy_from_upstream state after copy
        working-directory: "scripts/copy_from_upstream"
        run: |
          python3 copy_from_upstream.py -d copy && \
          git status --porcelain && \
          test -z "$(git status --porcelain)"
      - name: Restore compiled libjade cache
        id: cache-libjade
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pin@v4
        with:
          path: scripts/copy_from_upstream/repos/libjade
          # Keyed on the pinned upstream commit/jasmin version (in
          # copy_from_libjade.yml) and the patches applied on top -- any
          # change to either correctly invalidates the cache. The `make`
          # step below only recompiles what's out of date, so a full cache
          # hit turns the (previously ~90s, jasminc-compilation-heavy)
          # libjade build into a near no-op.
          key: libjade-${{ hashFiles('scripts/copy_from_upstream/copy_from_libjade.yml', 'scripts/copy_from_upstream/patches/libjade-*.patch') }}
      - name: Verify copy_from_upstream state after libjade
        working-directory: "scripts/copy_from_upstream"
        run: |
          python3 copy_from_upstream.py -d libjade && \
          git status --porcelain && \
          test -z "$(git status --porcelain)"
      - name: Cancel run on failure (fail-fast across jobs)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  buildcheck:
    name: Check that code passes a basic build
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    container: ghcr.io/baentsch/oqs-ci-ubuntu-latest-slim:latest
    env:
      KEM_NAME: ml_kem_768
      SIG_NAME: ml_dsa_65
    steps:
      - name: Create random build folder
        run: tmp_build=$(mktemp -d) && echo "RANDOM_BUILD_DIR=$tmp_build" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Configure
        run: |
          cmake \
            -B ${{ env.RANDOM_BUILD_DIR }} \
            -GNinja \
            -DOQS_STRICT_WARNINGS=ON \
            -DOQS_MINIMAL_BUILD="KEM_$KEM_NAME;SIG_$SIG_NAME" \
            --warn-uninitialized . > config.log 2>&1 && \
          cat config.log && \
          cmake -LA -N . && \
          ! (grep -i "uninitialized variable" config.log)
      - name: Build code
        run: ninja
        working-directory: ${{ env.RANDOM_BUILD_DIR }}
      - name: Build documentation
        run: ninja gen_docs
        working-directory: ${{ env.RANDOM_BUILD_DIR }}

  cppcheck:
    name: Check C++ linking with example program
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    container: ghcr.io/baentsch/oqs-ci-ubuntu-latest-slim:latest
    permissions:
      contents: read
      actions: write  # required to cancel the run on failure (fail-fast)
    env:
      SIG_NAME: ml_dsa_44
    steps:
      - name: Create random build folder
        run: tmp_build=$(mktemp -d) && echo "RANDOM_BUILD_DIR=$tmp_build" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Configure
        run: |
          cmake \
            -B ${{ env.RANDOM_BUILD_DIR }} \
            -GNinja \
            -DOQS_STRICT_WARNINGS=ON \
            -DOQS_MINIMAL_BUILD="SIG_$SIG_NAME" \
            --warn-uninitialized . > config.log 2>&1 && \
          cat config.log && \
          cmake -LA -N . && \
          ! (grep -i "uninitialized variable" config.log)
      - name: Build liboqs
        run: ninja
        working-directory: ${{ env.RANDOM_BUILD_DIR }}
      - name: Link with C++ program
        run: |
          g++ "$GITHUB_WORKSPACE"/cpp/sig_linking_test.cpp -g \
          -I./include -L./lib -loqs -lcrypto -std=c++11 -o example_sig && \
          ./example_sig
        working-directory: ${{ env.RANDOM_BUILD_DIR }}
      - name: Cancel run on failure (fail-fast across jobs)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  fuzzbuildcheck:
    name: Check that code passes a basic fuzzing build
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    container: ghcr.io/baentsch/oqs-ci-ubuntu-latest-slim:latest
    env:
      SIG_NAME: ml_dsa_44
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=fuzzer-no-link,address
      LDFLAGS: -fsanitize=address
    steps:
      - name: Create random build folder
        run: tmp_build=$(mktemp -d) && echo "RANDOM_BUILD_DIR=$tmp_build" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Configure
        run: |
          cmake \
            -B ${{ env.RANDOM_BUILD_DIR }} \
            -GNinja \
            -DOQS_STRICT_WARNINGS=ON \
            -DOQS_BUILD_FUZZ_TESTS=ON \
            -DOQS_MINIMAL_BUILD="SIG_$SIG_NAME" \
            --warn-uninitialized . > config.log 2>&1 && \
          cat config.log && \
          cmake -LA -N . && \
          ! (grep -i "uninitialized variable" config.log)
      - name: Build code
        run: ninja fuzz_test_sig
        working-directory: ${{ env.RANDOM_BUILD_DIR }}

      - name: Short fuzz check (30s)
        run: ./tests/fuzz_test_sig -max_total_time=30
        working-directory: ${{ env.RANDOM_BUILD_DIR }}

  nixflakecheck:
    name: Check that Nix flake has correct syntax and can build
    needs: [workflowcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required by magic-nix-cache-action
    steps:
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # pin@v14
        with:
          # Store paths already available from the public nixpkgs binary
          # cache (the vast majority of the toolchain closure: gcc, cmake,
          # ninja, doxygen, openssl, glibc, ...) do not need to be
          # duplicated into the GitHub Actions cache -- only genuinely
          # locally-built derivations (our own liboqs build) benefit from
          # being cached there. Without this, the automatic post-job
          # upload step re-uploads the full closure on every run.
          upstream-cache: '''https://cache.nixos.org'''

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
      - name: Check devShell
        run: nix develop --command echo
      - name: Check flake syntax
        run: nix flake check --no-build # check for accurate syntax
      - name: Check that the flake builds
        # Uses the lightweight .#ci package (OQS_MINIMAL_BUILD, 1 KEM + 1
        # SIG) instead of the default (OQS_DIST_BUILD=ON, all ~330+
        # algorithms). This only needs to validate that the flake
        # mechanism itself builds correctly -- and since the derivation's
        # src input is the full, ever-changing repo, Nix caching can never
        # avoid recompiling on every commit regardless of scope, so
        # keeping that scope small is what actually saves time here.
        run: nix build .#ci # check that the build runs

      - Nicolas Sendrier
      - Jean-Pierre Tillich
      - Valentin Vasseur
    crypto-assumption: >-
      Syndrome decoding of structure codes (Hamming Quasi-Cyclic)
    website: https://pqc-hqc.org/
    nist-round: 4

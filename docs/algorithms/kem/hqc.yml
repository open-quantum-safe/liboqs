name: HQC
type: kem
principal-submitters:
- Philippe Gaborit
crypto-assumption: Syndrome decoding of structure codes (Hamming Quasi-Cyclic)
website: https://pqc-hqc.org/
nist-round: 4
standardization-status: Selected by [NIST](https://pqc-hqc.org/doc/hqc_specifications_2026_10_12.pdf)
  for upcoming standardization
upstream-maintenance: TBD
upstream-statement-url: null
oqs-support-tier: 2
spec-version: 2026-10-12
upstream-ancestors:
- https://gitlab.com/pqc-hqc
- release v5.1.0 (specification 2026-10-12) at https://gitlab.com/pqc-hqc/hqc/-/releases/v5.1.0
parameter-sets:
- name: HQC-1
  claimed-nist-level: 1
  claimed-security: IND-CCA2
  length-public-key: 2241
  length-ciphertext: 4433
  length-secret-key: 32
  length-shared-secret: 32
  implementations-switch-on-runtime-cpu-features: true
  implementations:
  - upstream-id: ref
    supported-platforms: all
    common-crypto:
    - SHA3: liboqs
    no-secret-dependent-branching-claimed: true
    no-secret-dependent-branching-checked-by-valgrind: false
    large-stack-usage: false
    upstream: primary-upstream
    default: true
- name: HQC-3
  claimed-nist-level: 3
  claimed-security: IND-CCA2
  length-ciphertext: 8978
  length-public-key: 4514
  length-secret-key: 32
  length-shared-secret: 32
  implementations-switch-on-runtime-cpu-features: true
  implementations:
  - upstream-id: ref
    supported-platforms: all
    common-crypto:
    - SHA3: liboqs
    no-secret-dependent-branching-claimed: true
    no-secret-dependent-branching-checked-by-valgrind: false
    large-stack-usage: false
    upstream: primary-upstream
    default: true
- name: HQC-5
  claimed-nist-level: 5
  claimed-security: IND-CCA2
  length-ciphertext: 14421
  length-public-key: 7237
  length-secret-key: 32
  length-shared-secret: 32
  implementations-switch-on-runtime-cpu-features: true
  implementations:
  - upstream-id: ref
    supported-platforms: all
    common-crypto:
    - SHA3: liboqs
    no-secret-dependent-branching-claimed: true
    no-secret-dependent-branching-checked-by-valgrind: false
    large-stack-usage: false
    upstream: primary-upstream
    default: true
primary-upstream:
  spdx-license-identifier: Public domain
  source: https://gitlab.com/pqc-hqc/hqc/commit/06567ccbad10580d78dd7863b15d23f41076d57f

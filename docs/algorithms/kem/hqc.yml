name: HQC
type: kem
principal-submitters:
- Philippe Gaborit
crypto-assumption: Syndrome decoding of structure codes (Hamming Quasi-Cyclic)
website: https://pqc-hqc.org/
nist-round: 4
standardization-status: Selected by NIST for upcoming standardization
upstream-maintenance: TBD
upstream-statement-url: null
oqs-support-tier: 2
spec-version: 2026-10-12
upstream-ancestors:
- https://gitlab.com/pqc-hqc
advisories:
- HQC's AVX2 backend is not thread-safe. `src/kem/hqc/pqc-hqc_hqc_avx256_common/hqc.c`
  and `src/kem/hqc/pqc-hqc_hqc-<1,3,5>_x86_64/gf2x.c` use static buffers that might
  get corrupted when multiple instances of HQC AVX2 backends run concurrently. These
  `static` declarations were inherited from upstream and were likely put there to
  reduce stack usage. Set `OQS_ENABLE_KEM_hqc_{1,3,5}_x86_64=OFF` at CMake configure
  time to turn off AVX256 backends.
parameter-sets:
- name: HQC-1
  claimed-nist-level: 1
  claimed-security: IND-CCA2
  length-public-key: 2241
  length-ciphertext: 4433
  length-secret-key: 32
  length-shared-secret: 32
  implementations-switch-on-runtime-cpu-features: true
  implementations:
  - upstream-id: ref
    supported-platforms: all
    common-crypto:
    - SHA3: liboqs
    no-secret-dependent-branching-claimed: true
    no-secret-dependent-branching-checked-by-valgrind: false
    large-stack-usage: false
    upstream: primary-upstream
    default: true
  - upstream-id: x86_64
    supported-platforms:
    - architecture: x86_64
      operating_systems:
      - Linux
      - Darwin
      required_flags:
      - avx
      - avx2
      - bmi1
